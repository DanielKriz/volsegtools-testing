name: Documentation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build_docs:
    name: "Build documentation + Documentation Coverage Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install volsegtools and documentation dependencies
        run: uv sync --group docs
      - name: Build HTML of documentation
        run: >
          uv run --no-sync sphinx-build -n -W --keep-going -b html \
            --doctree-dir docs/_build/doctrees \ # Thanks to this we are sharing build info with coverage
            docs docs/_build/html
      - name: Build Sphinx documentation coverage report
        run: >
          uv run --no-sync sphinx-build -q -n -W --keep-going -b coverage \
            --doctree-dir docs/_build/doctrees \
            docs docs/_build/coverage
      - name: Publish coverage report
        run: |
          {
            echo "## Documentation Coverage"
            echo "---"
            cat docs/_build/coverage/python.txt
            echo "---"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare Pages uploadable artifact
        # if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/_build/html

  deploy_pages:
    name: "Deploy documentation to GitHub pages."
    # if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build_docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
